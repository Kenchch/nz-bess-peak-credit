name: ci
on: [push, pull_request]
jobs:
  test:
    # Windows too: the pipeline is run there, and a cp1252 pipe once broke it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # Offline: synthetic fixtures only, no EMI downloads
      - run: uv run pytest -q
